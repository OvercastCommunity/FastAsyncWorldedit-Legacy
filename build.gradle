import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.Property
import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters
import org.gradle.process.ExecOperations

import javax.inject.Inject

buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://plugins.gradle.org/m2/" }
    }
	dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.4.1'
    }
}

abstract class GitVersionValueSource implements ValueSource<String, GitVersionValueSource.Parameters> {
    interface Parameters extends ValueSourceParameters {
        DirectoryProperty getProjectDir()
        Property<Boolean> getNoVersion()
    }

    @Inject
    abstract ExecOperations getExecOperations()

    @Override
    String obtain() {
        if (parameters.noVersion.getOrElse(false)) {
            return "unknown"
        }

        try {
            File dir = parameters.projectDir.get().asFile
            String head = git(dir, "log", "-1", "--format=%ct%x00%h%x00%P")
            if (head.isEmpty()) {
                return "unknown"
            }

            String[] headParts = head.split("\u0000", -1)
            String date = new Date(Long.parseLong(headParts[0]) * 1000L).format("yy.MM.dd")
            String revision = "-${headParts[1]}"
            List<String> parents = headParts.length > 2 && !headParts[2].isEmpty()
                    ? headParts[2].split(" ").toList()
                    : []

            int index = -67 // Offset to match CI
            int major = 0
            int minor = 0
            int patch = 0

            for (; parents != null && !parents.isEmpty(); index++) {
                int majorCount = 0
                int minorCount = 0
                int patchCount = minor == 0 && major == 0 ? 1 : 0

                String commit = git(dir, "show", "-s", "--format=%B%x00%P", parents.get(0))
                String[] commitParts = commit.split("\u0000", -1)
                for (String line : commitParts[0].tokenize("\n")) {
                    switch (line.replaceAll("- ", "").split(" ")[0].toLowerCase()) {
                        case "minor":
                        case "added":
                        case "add":
                        case "change":
                        case "changed":
                        case "changes":
                            if (major == 0) {
                                minorCount = 1
                                patchCount = 0
                            }
                            break
                        case "refactor":
                        case "remove":
                        case "major":
                            patchCount = minorCount = 0
                            majorCount = 1
                            break
                    }
                }

                major += majorCount
                minor += minorCount
                patch += patchCount
                parents = commitParts.length > 1 && !commitParts[1].isEmpty()
                        ? commitParts[1].split(" ").toList()
                        : []
            }

            return "${date}${revision}-${index}-${major}.${minor}.${patch}"
        } catch (Throwable ignored) {
            return "unknown"
        }
    }

    private String git(File dir, String... args) {
        ByteArrayOutputStream output = new ByteArrayOutputStream()
        ByteArrayOutputStream error = new ByteArrayOutputStream()
        execOperations.exec {
            workingDir = dir
            commandLine = ["git"] + args.toList()
            standardOutput = output
            errorOutput = error
        }
        return output.toString("UTF-8").trim()
    }
}

task setupCIWorkspace {
    // do nothing, stub method
}

apply plugin: 'java'
clean { delete "target" }

group = 'com.boydti.fawe'

version = providers.of(GitVersionValueSource) {
    parameters.projectDir.set(layout.projectDirectory)
    parameters.noVersion.set(providers.gradleProperty("lzNoVersion").map { true }.orElse(false))
}.get()
description = """FastAsyncWorldEdit"""

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    compileJava {
        options.compilerArgs += ["-parameters"]
    }

    repositories {
        mavenCentral()
        maven { url = "https://hub.spigotmc.org/nexus/content/groups/public/" }
        maven { url = "https://maven.enginehub.org/repo/" }
        maven { url = "https://repo.maven.apache.org/maven2" }
        maven { url = "https://ci.frostcast.net/plugin/repository/everything" }
        maven { url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://repo.inventivetalent.org/content/groups/public/" }
        maven { url = "https://store.ttyh.ru/libraries/" }
        maven { url = "https://repo.dmulloy2.net/nexus/repository/public/" }
        maven { url = "https://maven.elmakers.com/repository/" }
        maven { url = "https://ci.ender.zone/plugin/repository/everything/" }
